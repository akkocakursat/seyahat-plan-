name: Testler

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.13.0', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  supabase-sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase benzeri ortam
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin;
            create schema extensions; create extension pgcrypto schema extensions;
            grant usage on schema extensions to anon, authenticated;"
      - name: Kurulum iki kez (tekrar çalıştırılabilirlik) ve API testleri
        run: |
          psql -q -v ON_ERROR_STOP=1 -f supabase/kurulum.sql
          psql -q -v ON_ERROR_STOP=1 -f supabase/kurulum.sql
          psql -q -v ON_ERROR_STOP=1 -f supabase/test.sql
