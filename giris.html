<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://tzxlqygyhbqdzkaihowf.supabase.co; form-action 'self'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <title>Giriş · Seyahat Defteri</title>
  <link rel="icon" href="v/e242b6b27c/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="v/e242b6b27c/apple-touch-icon.png">
  <link rel="stylesheet" href="v/e242b6b27c/css/app.css">
  <script type="module" src="v/e242b6b27c/js/giris.js"></script>
</head>
<body class="login-page">
  <main class="login-wrap">
    <form class="login" id="login-form" novalidate>
      <img class="logo logo-big" src="v/e242b6b27c/favicon.svg" alt="" width="48" height="48">
      <h1>Seyahat Defteri</h1>
      <p class="login-sub">Ekibin iş seyahatleri tek yerde.</p>
      <div class="field">
        <label for="username">Kullanıcı adı</label>
        <input name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="100">
      </div>
      <div class="field">
        <label for="password">Parola</label>
        <input name="password" id="password" type="password" autocomplete="current-password" required maxlength="1024">
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-wide" id="login-submit">Giriş yap</button>
    </form>
  </main>
</body>
</html>
